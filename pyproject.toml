[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-research"
version = "1.0.0"
description = "Reproducible research on order flow, liquidity, and short-horizon prediction"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4", "matplotlib>=3.8", "pyarrow>=15", "jinja2>=3.1", "duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "pypdf>=5"]

[project.scripts]
orderflow = "orderflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
